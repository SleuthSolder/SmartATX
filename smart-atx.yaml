# =============================================================================
# Smart ATX Bench Supply — ESPHome configuration
#
# An ESP32 turns a scrap PC (ATX) power supply into a bench supply switchable
# from Home Assistant. It works because of one trick:
#
#   An ATX supply's main rails stay off until PS_ON (pin 16, green) is pulled
#   to ground — but a controller can't ground it without power. The +5VSB rail
#   (pin 9, violet) is always live, even with the supply "off", so it powers
#   the ESP32, which then grounds PS_ON on command.
#
# Wiring (unchanged from the 2020 build):
#
#   ESP32 pin  | ATX 24-pin  | Wire   | Purpose
#   -----------|-------------|--------|-----------------------------------------
#   Vin        | pin 9       | violet | +5VSB, always-on standby rail
#   GND        | pin 19      | black  | ground
#   GPIO18     | pin 16      | green  | PS_ON — ground it to start the supply
#
# Replaces the original FauxmoESP firmware, which emulated a Philips Hue bulb
# so Alexa could discover it over SSDP. Newer Echo devices stopped finding it.
# Voice control now rides Home Assistant instead of any on-device emulation.
#
# The build write-up, including how the board was identified and the PS_ON
# voltage caveat, is on the project website. See the README.
# =============================================================================

substitutions:
  device_name: smart-atx
  friendly_name: "Smart ATX Bench Supply"

  # --- Hardware-specific values ---------------------------------------------
  # These two are the only board-dependent settings in this file. If you are
  # adapting this to a different ESP32 board, these plus `board:` below are all
  # you need to change.

  # Drives PS_ON. Must be a pin that boots high-impedance — GPIO18 is not a
  # strapping pin, so it floats during the boot window before ESPHome takes
  # over, which keeps the supply off. Do not move this to GPIO0, 2, 5, 12 or 15
  # without checking the ESP32 strapping-pin table first.
  ps_on_pin: GPIO18

  # Onboard blue LED on the DevKit V1. GPIO2 is a strapping pin, but it only
  # matters at boot, and this board's LED sits between the pin and ground so it
  # can't hold the pin high while the ESP32 samples it. Driving it as an output
  # afterwards is fine.
  #
  # ESPHome prints "GPIO2 is a strapping PIN" on every build because of this.
  # The warning is expected and is left visible on purpose rather than silenced
  # with `ignore_strapping_warning: true` -- if you adapt this to a board whose
  # LED is wired to 3.3 V instead of ground, that warning is one you want to
  # see.
  status_led_pin: GPIO2

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "ATX bench supply — ESP32 on +5VSB grounds PS_ON"

esp32:
  # PlatformIO board ID for the ESP32 DEVKIT V1, confirmed against the
  # physical board on 2026-09-14. The 2020 build never recorded which board it
  # used; the write-up covers how it was identified.
  # Adapting to a different board: change this line and status_led_pin above.
  # Nothing else depends on it.
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf

logger:
  level: INFO

# Native API — this is how Home Assistant talks to the device. No cloud, no
# Hue emulation, no SSDP. The encryption key lives in secrets.yaml.
api:
  encryption:
    key: !secret api_encryption_key

# Over-the-air updates, so the ESP32 can be reflashed while wired into the
# supply. The first flash must still be over USB.
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # If the network is unreachable, raise an AP so the device can be recovered
  # without unwiring it. The supply stays OFF the whole time — see the switch
  # definition below.
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# Backs the free-heap and reset-reason diagnostics further down.
debug:
  update_interval: 60s

# -----------------------------------------------------------------------------
# Outputs
# -----------------------------------------------------------------------------
output:
  # Onboard LED, driven from the switch's automations so it mirrors the supply.
  # Gives an at-a-glance state at the bench without opening Home Assistant.
  - platform: gpio
    id: status_led_output
    pin: ${status_led_pin}

# -----------------------------------------------------------------------------
# The supply itself
# -----------------------------------------------------------------------------
switch:
  - platform: gpio
    id: atx_psu
    name: "Power"
    icon: "mdi:power-plug"

    pin:
      number: ${ps_on_pin}

      # OPEN DRAIN — this is the safety-critical part of the whole config.
      #
      # The pin can only pull PS_ON low or let go of it entirely; it can never
      # drive PS_ON high. The supply's own internal pull-up (~3.8 V, measured)
      # defines the "off" state. This mirrors what the 2020 sketch did by
      # toggling pinMode() between INPUT (float = off) and OUTPUT+LOW (on).
      #
      # A plain push-pull output would be wrong: it would actively drive PS_ON
      # to 3.3 V against the supply's 3.8 V pull-up, fighting it and sourcing
      # current into the PSU's control input.
      #
      # 3.8 V is above the ESP32's absolute-maximum input (VDD + 0.3 V = 3.6 V),
      # though only slightly, and the measured current is under 1 mA. Other
      # supplies differ -- the ATX specification pulls PS_ON up to +5VSB, so
      # measure your own before assuming it is this gentle.
      mode:
        output: true
        open_drain: true

      # Open drain writes LOW to pull down and HIGH to release. Switch "on"
      # must pull PS_ON down, so the logic is inverted.
      #
      # Net effect, which is what matters here:
      #   OFF -> gpio_set_level(18, 1) -> pull-down FET off -> pin floats
      #   ON  -> gpio_set_level(18, 0) -> pull-down FET on   -> pin at GND
      #
      # This is one static pin mode (GPIO_MODE_OUTPUT_OD), not a mode toggle.
      # The 2020 sketch got the same two states by switching pinMode() between
      # INPUT and OUTPUT; open drain reaches them without ever reconfiguring
      # the pin, and leaves the input buffer disabled so ESP32 lets the power
      # supply pull the line up and the ESP32's pin is just floating.
      #
      # Boot-order note: the ESP32's GPIO_OUT register resets to 0, so enabling
      # an open-drain output before writing a level would momentarily pull
      # PS_ON low and kick the supply on. ESPHome avoids this — GPIOSwitch
      # setup() writes the off state *before* it configures the pin, then
      # writes it again after. Before ESPHome runs at all, GPIO18's reset
      # default is high-impedance input with pulls disabled, so the supply
      # stays off through the whole boot window.
      inverted: true

    # ALWAYS_OFF, not RESTORE_DEFAULT_OFF. After a power blip, crash, or
    # reflash, the supply must come back OFF — never resume on its own into a
    # load nobody is standing next to.
    restore_mode: ALWAYS_OFF

    on_turn_on:
      - output.turn_on: status_led_output
    on_turn_off:
      - output.turn_off: status_led_output

# -----------------------------------------------------------------------------
# Diagnostics — none of these can affect the supply's state
# -----------------------------------------------------------------------------
sensor:
  - platform: uptime
    type: seconds
    name: "Uptime"
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: debug
    free:
      name: "Heap Free"
      entity_category: diagnostic

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"
      entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic
